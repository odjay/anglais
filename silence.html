<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Tinnitus Therapy System</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --success: #27ae60;
            --danger: #c0392b;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f8f9fa;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .control-group {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            border: 1px solid #eee;
        }

        input[type="range"] {
            width: 100%;
            margin: 10px 0;
            accent-color: var(--secondary);
        }

        canvas {
            width: 100%;
            height: 120px;
            margin: 20px 0;
        }

        button {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: opacity 0.3s;
            margin: 5px;
        }

        #startStop {
            background: var(--success);
            padding: 15px 30px;
            font-size: 1.1em;
        }

        .warning {
            color: var(--danger);
            font-size: 0.9em;
            margin: 15px 0;
            padding: 10px;
            background: #f8d7da;
            border-radius: 5px;
        }

        label {
            display: block;
            margin: 8px 0;
            font-weight: 500;
        }

        select, input[type="checkbox"] {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tinnitus Management System</h1>
        <div class="warning">
            ⚠️ Professional supervision recommended | Maximum 60dB | Not a medical device
        </div>

        <div class="grid">
            <div class="control-group">
                <h3>Core Parameters</h3>
                <label>Frequency: <span id="baseFreq">4000</span> Hz</label>
                <input type="range" id="baseFreqSlider" min="125" max="12000" value="4000" step="1">
                
                <label>Volume: <span id="volumeValue">50</span>%</label>
                <input type="range" id="volumeSlider" min="0" max="100" value="50">
                
                <button id="startStop">Start Therapy</button>
            </div>

            <div class="control-group">
                <h3>Modulation</h3>
                <label>Modulation Rate: <span id="modRate">40</span> Hz</label>
                <input type="range" id="modRateSlider" min="0.1" max="100" value="40" step="0.1">
                
                <label>Modulation Depth: <span id="modDepth">30</span>%</label>
                <input type="range" id="modDepthSlider" min="0" max="100" value="30">
                
                <label>Wave Type:
                    <select id="waveType">
                        <option value="sine">Sine</option>
                        <option value="square">Square</option>
                        <option value="sawtooth">Sawtooth</option>
                    </select>
                </label>
            </div>
        </div>

        <div class="grid">
            <div class="control-group">
                <h3>Therapy Presets</h3>
                <button onclick="setPreset('acute')">Acute Phase</button>
                <button onclick="setPreset('maintenance')">Maintenance</button>
                <button onclick="setPreset('gamma')">Gamma Entrainment</button>
            </div>

            <div class="control-group">
                <h3>Advanced Features</h3>
                <label><input type="checkbox" id="phaseInvert"> Phase Inversion</label>
                <label><input type="checkbox" id="binauralToggle"> Binaural Beats</label>
                <label><input type="checkbox" id="noiseToggle"> Pink Noise</label>
                <label>Beat Freq: <span id="beatFreqValue">10</span>Hz
                    <input type="range" id="beatFreqSlider" min="0.1" max="40" value="10" step="0.1">
                </label>
            </div>
        </div>

        <canvas id="visualizer"></canvas>
    </div>

    <script>
        let audioContext, mainOsc, modOsc, gainNode, analyser, noiseNode;
        let isPlaying = false, binauralEnabled = false;
        let leftOsc, rightOsc, merger, splitter;

        function initAudio() {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            gainNode = audioContext.createGain();
            analyser = audioContext.createAnalyser();
            
            analyser.fftSize = 2048;
            gainNode.connect(analyser);
            analyser.connect(audioContext.destination);
            
            drawVisualizer();
        }

        function createOscillators() {
            const baseFreq = parseFloat(document.getElementById('baseFreqSlider').value);
            const waveType = document.getElementById('waveType').value;
            
            // Main oscillator
            mainOsc = audioContext.createOscillator();
            mainOsc.type = waveType;
            mainOsc.frequency.setValueAtTime(baseFreq, audioContext.currentTime);

            // Modulation system
            modOsc = audioContext.createOscillator();
            const modGain = audioContext.createGain();
            modOsc.type = 'sine';
            modOsc.frequency.setValueAtTime(
                parseFloat(document.getElementById('modRateSlider').value),
                audioContext.currentTime
            );
            modGain.gain.setValueAtTime(
                document.getElementById('modDepthSlider').value / 100 * baseFreq,
                audioContext.currentTime
            );
            modOsc.connect(modGain);
            modGain.connect(mainOsc.frequency);

            // Phase inversion
            const phaseInvertGain = audioContext.createGain();
            phaseInvertGain.gain.value = document.getElementById('phaseInvert').checked ? -1 : 1;
            mainOsc.connect(phaseInvertGain);

            // Binaural beats
            if(binauralEnabled) {
                const beatFreq = parseFloat(document.getElementById('beatFreqSlider').value);
                splitter = audioContext.createChannelSplitter(2);
                merger = audioContext.createChannelMerger(2);

                leftOsc = audioContext.createOscillator();
                rightOsc = audioContext.createOscillator();
                leftOsc.frequency.setValueAtTime(baseFreq - beatFreq/2, audioContext.currentTime);
                rightOsc.frequency.setValueAtTime(baseFreq + beatFreq/2, audioContext.currentTime);

                leftOsc.connect(merger, 0, 0);
                rightOsc.connect(merger, 0, 1);
                phaseInvertGain.connect(merger);
                merger.connect(gainNode);
            } else {
                phaseInvertGain.connect(gainNode);
            }

            // Pink noise
            if(document.getElementById('noiseToggle').checked) {
                noiseNode = createPinkNoise();
                noiseNode.connect(gainNode);
            }

            mainOsc.start();
            modOsc.start();
            if(binauralEnabled) {
                leftOsc.start();
                rightOsc.start();
            }
        }

        function createPinkNoise() {
            const bufferSize = 4096;
            let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
            
            const node = audioContext.createScriptProcessor(bufferSize, 1, 1);
            node.onaudioprocess = e => {
                const output = e.outputBuffer.getChannelData(0);
                for(let i = 0; i < bufferSize; i++) {
                    const white = Math.random() * 2 - 1;
                    b0 = 0.99886 * b0 + white * 0.0555179;
                    b1 = 0.99332 * b1 + white * 0.0750759;
                    b2 = 0.96900 * b2 + white * 0.1538520;
                    b3 = 0.86650 * b3 + white * 0.3104856;
                    b4 = 0.55000 * b4 + white * 0.5329522;
                    b5 = -0.7616 * b5 - white * 0.0168980;
                    output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.11;
                    b6 = white * 0.115926;
                }
            };
            return node;
        }

        function toggleAudio() {
            if (!isPlaying) {
                if (!audioContext) initAudio();
                createOscillators();
                isPlaying = true;
                document.getElementById('startStop').textContent = 'Stop Therapy';
            } else {
                mainOsc.stop();
                modOsc.stop();
                if(binauralEnabled) {
                    leftOsc.stop();
                    rightOsc.stop();
                }
                if(noiseNode) noiseNode.disconnect();
                isPlaying = false;
                document.getElementById('startStop').textContent = 'Start Therapy';
            }
        }

        // Visualizer
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        function drawVisualizer() {
            if(!analyser) return;
            
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteTimeDomainData(dataArray);

            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.beginPath();
            ctx.lineWidth = 2;
            ctx.strokeStyle = var(--secondary);
            
            const sliceWidth = canvas.width / bufferLength;
            let x = 0;

            for(let i = 0; i < bufferLength; i++) {
                const v = dataArray[i] / 128.0;
                const y = v * canvas.height/2 + canvas.height/2;

                i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                x += sliceWidth;
            }

            ctx.stroke();
            requestAnimationFrame(drawVisualizer);
        }

        // Event Listeners
        document.getElementById('startStop').addEventListener('click', toggleAudio);
        
        document.getElementById('binauralToggle').addEventListener('change', function(e) {
            binauralEnabled = e.target.checked;
            if(isPlaying) {
                toggleAudio();
                toggleAudio();
            }
        });

        document.getElementById('baseFreqSlider').addEventListener('input', function(e) {
            document.getElementById('baseFreq').textContent = e.target.value;
            if(mainOsc) mainOsc.frequency.setValueAtTime(e.target.value, audioContext.currentTime);
        });

        document.getElementById('volumeSlider').addEventListener('input', function(e) {
            const vol = e.target.value / 100;
            document.getElementById('volumeValue').textContent = e.target.value;
            gainNode.gain.setValueAtTime(vol, audioContext.currentTime);
        });

        // Presets
        const presets = {
            acute: { baseFreq: 4000, modRate: 40, modDepth: 30, volume: 50 },
            maintenance: { baseFreq: 4000, modRate: 10, modDepth: 15, volume: 30 },
            gamma: { baseFreq: 40, modRate: 40, modDepth: 80, volume: 40 }
        };

        function setPreset(presetKey) {
            const preset = presets[presetKey];
            document.getElementById('baseFreqSlider').value = preset.baseFreq;
            document.getElementById('modRateSlider').value = preset.modRate;
            document.getElementById('modDepthSlider').value = preset.modDepth;
            document.getElementById('volumeSlider').value = preset.volume;
            
            document.getElementById('baseFreq').textContent = preset.baseFreq;
            document.getElementById('modRate').textContent = preset.modRate;
            document.getElementById('modDepth').textContent = preset.modDepth;
            document.getElementById('volumeValue').textContent = preset.volume;
            
            if(isPlaying) {
                toggleAudio();
                toggleAudio();
            }
        }
    </script>
</body>
</html>
