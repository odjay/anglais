<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tinnitus Management System</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f0f4f8;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .control-group {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        input[type="range"] {
            width: 100%;
            margin: 10px 0;
        }

        canvas {
            border: 1px solid #ddd;
            margin: 20px 0;
        }

        button {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: opacity 0.3s;
            margin: 5px;
        }

        button:hover {
            opacity: 0.9;
        }

        #startStop {
            background: #27ae60;
            padding: 15px 30px;
            font-size: 1.1em;
        }

        .warning {
            color: #c0392b;
            font-size: 0.9em;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tinnitus Sound Therapy Generator</h1>
        <div class="warning">
            ⚠️ Consult an audiologist before use | Max volume 60dB | Not a medical device
        </div>

        <div class="grid">
            <div class="control-group">
                <h3>Core Controls</h3>
                <label>Frequency: <span id="baseFreq">4000</span> Hz</label>
                <input type="range" id="baseFreqSlider" min="125" max="12000" value="4000" step="1">
                
                <label>Volume: <span id="volumeValue">50</span>%</label>
                <input type="range" id="volumeSlider" min="0" max="100" value="50">
                
                <button id="startStop">Start Therapy</button>
            </div>

            <div class="control-group">
                <h3>Modulation</h3>
                <label>Modulation Rate: <span id="modRate">40</span> Hz</label>
                <input type="range" id="modRateSlider" min="0.1" max="100" value="40" step="0.1">
                
                <label>Modulation Depth: <span id="modDepth">30</span>%</label>
                <input type="range" id="modDepthSlider" min="0" max="100" value="30">
                
                <label>Wave Type:
                    <select id="waveType">
                        <option value="sine">Sine</option>
                        <option value="square">Square</option>
                        <option value="sawtooth">Sawtooth</option>
                    </select>
                </label>
            </div>
        </div>

        <div class="grid">
            <div class="control-group">
                <h3>Therapy Presets</h3>
                <button onclick="setPreset('acute')">Acute Phase</button>
                <button onclick="setPreset('maintenance')">Maintenance</button>
                <button onclick="setPreset('gamma')">Gamma Entrainment</button>
            </div>

            <div class="control-group">
                <h3>Advanced Features</h3>
                <label><input type="checkbox" id="phaseInvert"> Phase Inversion</label>
                <label><input type="checkbox" id="binauralToggle"> Binaural Beats</label>
                <label><input type="checkbox" id="noiseToggle"> Add Pink Noise</label>
            </div>
        </div>

        <canvas id="visualizer" width="800" height="100"></canvas>
    </div>

    <script>
        let audioContext;
        let mainOscillator;
        let gainNode;
        let analyser;
        let modGain;
        let modOscillator;
        let noiseNode;
        let isPlaying = false;

        // Initialize audio context on first user interaction
        function initAudio() {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            gainNode = audioContext.createGain();
            analyser = audioContext.createAnalyser();
            modGain = audioContext.createGain();
            
            analyser.fftSize = 2048;
            gainNode.connect(analyser);
            analyser.connect(audioContext.destination);
            
            drawVisualizer();
        }

        // Visualizer setup
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        const bufferLength = analyser ? analyser.frequencyBinCount : 2048;
        const dataArray = new Uint8Array(bufferLength);

        function drawVisualizer() {
            if (!analyser) return;
            
            requestAnimationFrame(drawVisualizer);
            analyser.getByteTimeDomainData(dataArray);
            
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.beginPath();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#3498db';
            
            const sliceWidth = canvas.width / bufferLength;
            let x = 0;

            for(let i = 0; i < bufferLength; i++) {
                const v = dataArray[i] / 128.0;
                const y = v * canvas.height/2;

                if(i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);

                x += sliceWidth;
            }

            ctx.stroke();
        }

        // Control handlers
        document.getElementById('startStop').addEventListener('click', function() {
            if (!audioContext) initAudio();
            
            if (!isPlaying) {
                startAudio();
                this.textContent = 'Stop Therapy';
                isPlaying = true;
            } else {
                stopAudio();
                this.textContent = 'Start Therapy';
                isPlaying = false;
            }
        });

        function startAudio() {
            mainOscillator = audioContext.createOscillator();
            mainOscillator.type = document.getElementById('waveType').value;
            mainOscillator.frequency.setValueAtTime(
                parseInt(document.getElementById('baseFreqSlider').value),
                audioContext.currentTime
            );

            modOscillator = audioContext.createOscillator();
            modOscillator.type = 'sine';
            modOscillator.frequency.setValueAtTime(
                parseFloat(document.getElementById('modRateSlider').value),
                audioContext.currentTime
            );

            modGain.gain.setValueAtTime(
                document.getElementById('modDepthSlider').value / 100,
                audioContext.currentTime
            );

            modOscillator.connect(modGain);
            modGain.connect(mainOscillator.frequency);
            
            if (document.getElementById('phaseInvert').checked) {
                mainOscillator.detune.setValueAtTime(180, audioContext.currentTime);
            }

            mainOscillator.connect(gainNode);
            
            // Handle pink noise
            if (document.getElementById('noiseToggle').checked) {
                noiseNode = audioContext.createScriptProcessor(4096, 1, 1);
                noiseNode.onaudioprocess = function(e) {
                    const output = e.outputBuffer.getChannelData(0);
                    for (let i = 0; i < output.length; i++) {
                        output[i] = Math.random() * 0.4 - 0.2;
                    }
                };
                noiseNode.connect(gainNode);
            }

            mainOscillator.start();
            modOscillator.start();
            updateVolume();
        }

        function stopAudio() {
            if (mainOscillator) {
                mainOscillator.stop();
                modOscillator.stop();
                if (noiseNode) noiseNode.disconnect();
                mainOscillator = null;
                modOscillator = null;
                noiseNode = null;
            }
        }

        // Update controls
        document.getElementById('baseFreqSlider').addEventListener('input', function(e) {
            const freq = parseInt(e.target.value);
            document.getElementById('baseFreq').textContent = freq;
            if(mainOscillator) mainOscillator.frequency.setValueAtTime(freq, audioContext.currentTime);
        });

        document.getElementById('volumeSlider').addEventListener('input', updateVolume);

        function updateVolume() {
            const vol = document.getElementById('volumeSlider').value / 100;
            document.getElementById('volumeValue').textContent = document.getElementById('volumeSlider').value;
            if(gainNode) gainNode.gain.setValueAtTime(vol, audioContext.currentTime);
        }

        // Preset configurations
        const presets = {
            acute: {
                baseFreq: 4000,
                modRate: 40,
                modDepth: 30,
                volume: 50
            },
            maintenance: {
                baseFreq: 4000,
                modRate: 10,
                modDepth: 15,
                volume: 30
            },
            gamma: {
                baseFreq: 40,
                modRate: 40,
                modDepth: 80,
                volume: 40
            }
        };

        function setPreset(presetKey) {
            const preset = presets[presetKey];
            document.getElementById('baseFreqSlider').value = preset.baseFreq;
            document.getElementById('modRateSlider').value = preset.modRate;
            document.getElementById('modDepthSlider').value = preset.modDepth;
            document.getElementById('volumeSlider').value = preset.volume;
            
            document.getElementById('baseFreq').textContent = preset.baseFreq;
            document.getElementById('modRate').textContent = preset.modRate;
            document.getElementById('modDepth').textContent = preset.modDepth;
            document.getElementById('volumeValue').textContent = preset.volume;
            
            updateVolume();
        }
    </script>
</body>
</html>
